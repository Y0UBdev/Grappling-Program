}

      text:"Lève-toi avant 8h30, petit-déjeuner 3 h avant, M1 de 10 min. "+cs.sun,refs:["CLUB"]});
    pm=B({short:"Récup",title:"Récup + bilan",dur:"≈ 45 min",load:1,
      text:"Marche 20 min, M2 allégé 15 min, repas riche en protéines et glucides, bilan de semaine dans le journal (10 min)"+(p===3?", mise au point de la semaine de compétition.":p===2?". Dernière semaine pleine charge terminée.":", préparation de la suivante."),refs:["M2"]});
  }
  return {am:am,pm:pm};
}
var DAYS=[];
for(var i=0;i<N;i++){var b=build(Math.floor(i/7),i%7);DAYS.push(b);}

/* ---------- State ---------- */
var DONE={};
try{DONE=JSON.parse(localStorage.getItem("jjb28-done")||"{}")||{};}catch(e){DONE={};}
function saveDone(){try{localStorage.setItem("jjb28-done",JSON.stringify(DONE));}catch(e){}}
var today0=new Date();today0=new Date(today0.getFullYear(),today0.getMonth(),today0.getDate());
var todayIdx=Math.round((today0-new Date(2026,9,5))/864e5);
var startDay=todayIdx<0?0:todayIdx>=N?N-1:todayIdx;
var st={view:"cal",day:startDay,fiche:"M1"};
try{var sv=localStorage.getItem("jjb28-view");if(sv==="cal"||sv==="day"||sv==="fiches")st.view=sv;}catch(e){}
try{var sd=parseInt(localStorage.getItem("jjb28-day"),10);if(sd>=0&&sd<N&&todayIdx<0)st.day=sd;}catch(e){}
var hm=/^#j(\d+)$/.exec(location.hash||"");if(hm&&+hm[1]<N){st.day=+hm[1];st.view="day";}

/* ---------- Rendering ---------- */
function rowsHTML(rows){
  return '<ul class="exs">'+rows.map(function(r){
    var link=r.q?'<a class="v" href="'+yt(r.q)+'" target="_blank" rel="noopener">Vidéo ↗</a>':'<span class="v none">Vidéo</span>';
    return '<li class="ex"><span class="n">'+r.n+'</span><span class="dose">'+r.d+'</span><span class="c">'+r.c+'</span>'+link+'</li>';
  }).join("")+'</ul>';
}
function tableHTML(b){
  return '<div class="tw"><table><thead><tr>'+b.head.map(function(h){return "<th>"+h+"</th>";}).join("")+'</tr></thead><tbody>'+
    b.body.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>";}).join("")+'</tbody></table></div>';
}
function ficheHTML(id){
  return FICHES[id].blocks.map(function(b){
    if(b.t==="rows")return rowsHTML(b.rows);
    if(b.t==="table")return tableHTML(b);
    if(b.t==="p")return '<p class="note">'+b.x+'</p>';
    if(b.t==="h")return '<h4>'+b.x+'</h4>';
    if(b.t==="ul")return '<ul class="bul">'+b.x.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul>';
    return "";
  }).join("");
}
function dayDone(i){
  var d=DAYS[i],n=0,k=0;
  ["am","pm"].forEach(function(s){if(d[s].load>0){n++;if(DONE[i+"-"+s])k++;}});
  return n>0&&k===n;
}
function totals(){
  var n=0,k=0;
  for(var i=0;i<N;i++){["am","pm"].forEach(function(s){if(DAYS[i][s].load>0){n++;if(DONE[i+"-"+s])k++;}});}
  return {n:n,k:k};
}
function nextClub(){
  for(var i=Math.max(todayIdx,0);i<=52;i++){
    var dw=i%7;if(dw===3||dw===6)return JOURS[dw]+" "+fmt(i);
  }
  return "—";
}
function hero(){
  var dl=Math.round((new Date(2026,10,28)-today0)/864e5),t=totals();
  var cnt=dl>0?"J−"+dl:dl===0?"Jour J":"Fait";
  var lab=dl>0?"avant la compétition":dl===0?"c’est aujourd’hui":"compétition passée";
  var wk=todayIdx<0?"Départ lundi 5 octobre":todayIdx>=N?"Cycle terminé":"Semaine "+(Math.floor(todayIdx/7)+1)+" sur 8";
  return '';
}
function calendar(){
  var h='<div class="sec-h"><h2>Les 8 semaines</h2><p>5 octobre → 29 novembre 2026</p></div><div class="cal"><div class="row head"><div></div>'+
    JOURS.map(function(j){return "<div>"+j.slice(0,3)+"</div>";}).join("")+'</div>';
  for(var w=0;w<8;w++){
    var np=w>0&&phaseOf(w)!==phaseOf(w-1)&&!(w===7&&phaseOf(6)===3&&false);
    var nph=w>0&&WKN[w]!==WKN[w-1];
    h+='<div class="row wk'+(nph?" newphase":"")+'"><div class="wk-h"><b>S'+(w+1)+'</b><small>'+WKN[w]+'</small></div>';
    for(var dw=0;dw<7;dw++){
      var i=w*7+dw,d=DAYS[i],dt=dateOf(i);
      var cls="cell"+(i===todayIdx?" today":"")+(d.pm.comp?" comp":"")+(dayDone(i)?" all-done":"");
      var mon=(dt.getDate()===1||i===0)?"<small>"+MOIS[dt.getMonth()].slice(0,3)+".</small>":"";
      h+='<button class="'+cls+'" data-day="'+i+'" aria-label="'+fmtFull(i)+'"><span class="tick">✓</span><span class="d">'+dt.getDate()+mon+'</span>'+
        '<span class="lab"><em>'+d.am.short+'</em><b>'+d.pm.short+'</b></span>'+
        '<span class="bars"><i class="l'+d.am.load+'"></i><i class="l'+d.pm.load+'"></i></span></button>';
    }
    h+='</div>';
  }
  h+='</div><div class="legend"><span>Barre du haut : matin. Barre du bas : après-midi et soirée.</span>'+
    [0,1,2,3].map(function(l){return '<span><i class="l'+l+'"></i>'+LOADN[l]+'</span>';}).join("")+'</div>';
  return h;
}
function blockHTML(i,slot,b){
  var key=i+"-"+slot,done=!!DONE[key];
  var meta='<div class="b-meta"><span class="b-slot">'+(slot==="am"?"Matin":"Après-midi & soirée")+'</span><span class="b-dur">'+b.dur+'</span>'+
    '<span class="b-load"><i class="l'+b.load+'"></i>'+LOADN[b.load]+'</span>'+
    (b.load>0?'<button class="chk" data-done="'+key+'" aria-pressed="'+done+'"><span class="box"></span>Fait</button>':'')+'</div>';
  var main='<div class="b-main"><h3>'+b.title+'</h3><p class="b-text">'+b.text+'</p>'+(b.ex?rowsHTML(b.ex):"")+
    b.refs.map(function(r){return '<details class="fiche"><summary>'+FICHES[r].name+'</summary><div class="fb">'+ficheHTML(r)+'</div></details>';}).join("")+'</div>';
  return '<section class="block'+(b.load===0?" is-rest":"")+'">'+meta+main+'</section>';
}
function dayView(){
  var i=st.day,w=Math.floor(i/7),d=DAYS[i];
  var eb="Semaine "+(w+1)+" · "+PHN[phaseOf(w)]+(i===todayIdx?" · Aujourd’hui":"");
  var h='<div class="dayhead"><div><p class="eyebrow">'+eb+'</p><h2>'+fmtFull(i)+'</h2></div>'+
    '<div class="pn"><button data-nav="-1" aria-label="Jour précédent"'+(i===0?" disabled":"")+'>←</button><button data-nav="1" aria-label="Jour suivant"'+(i===N-1?" disabled":"")+'>→</button></div></div>';
  h+='<div class="strip">';
  for(var k=0;k<7;k++){
    var j=w*7+k;
    h+='<button data-day="'+j+'"'+(j===i?' aria-current="date"':"")+' aria-label="'+fmtFull(j)+'"><small>'+JL[k]+'</small><b>'+dateOf(j).getDate()+'</b></button>';
  }
  h+='</div>';
  h+=blockHTML(i,"am",d.am)+blockHTML(i,"pm",d.pm);
  return h;
}
function fichesView(){
  var f=FICHES[st.fiche];
  var h='<div class="sec-h"><h2>Fiches</h2><p>Les séances types, au même endroit.</p></div><div class="fnav">'+
    FORDER.map(function(id){return '<button data-fiche="'+id+'" aria-current="'+(id===st.fiche)+'">'+FSHORT[id]+'</button>';}).join("")+'</div>';
  h+='<div class="fview"><h3>'+f.name+'</h3><p class="sub">'+f.sub+'</p>'+ficheHTML(st.fiche)+'</div>';
  return h;
}
function render(){
  var app=document.getElementById("app");
  app.innerHTML=st.view==="cal"?hero()+calendar():st.view==="day"?dayView():fichesView();
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
    if(t.getAttribute("data-view")===st.view)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current");
  });
  try{localStorage.setItem("jjb28-view",st.view);localStorage.setItem("jjb28-day",String(st.day));}catch(e){}
}
function go(view,top){st.view=view;render();if(top!==false)window.scrollTo(0,0);}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-view],[data-day],[data-nav],[data-done],[data-fiche]");
  if(!t)return;
  if(t.hasAttribute("data-view")){go(t.getAttribute("data-view"));return;}
  if(t.hasAttribute("data-fiche")){st.fiche=t.getAttribute("data-fiche");render();return;}
  if(t.hasAttribute("data-nav")){var n=st.day+parseInt(t.getAttribute("data-nav"),10);if(n>=0&&n<N){st.day=n;render();window.scrollTo(0,0);}return;}
  if(t.hasAttribute("data-done")){
    var k=t.getAttribute("data-done");
    if(DONE[k])delete DONE[k];else DONE[k]=1;
    saveDone();
    t.setAttribute("aria-pressed",String(!!DONE[k]));
    return;
  }
  if(t.hasAttribute("data-day")){st.day=parseInt(t.getAttribute("data-day"),10);go("day");return;}
});
document.addEventListener("keydown",function(e){
  if(st.view!=="day")return;
  if(e.key==="ArrowLeft"&&st.day>0){st.day--;render();}
  if(e.key==="ArrowRight"&&st.day<N-1){st.day++;render();}
});
render();
})();
</script>

</body></html>
